# Local development services. Credentials are local-only placeholders matching .env.example.
# MinIO no longer publishes official images to Docker Hub, so the frozen Bitnami legacy
# images are pinned here; they are for local development only and receive no updates.
name: pharmacist-platform

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pharma
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: pharma
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharma -d pharma"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: local-dev-only
      MINIO_ROOT_PASSWORD: local-dev-only-secret
      MINIO_DEFAULT_BUCKETS: ""
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 local-dev-only local-dev-only-secret
        mc mb --ignore-existing local/pharma-private
        mc mb --ignore-existing local/pharma-public
        mc anonymous set none local/pharma-private
        mc anonymous set download local/pharma-public

  mailpit:
    image: axllent/mailpit:v1.31.6
    # Depending on the one-shot init job makes `up --wait` treat its clean exit
    # as success; without a dependent, Compose reports the exited container as a failure.
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Malware scanner for the upload worker (ADR-004). Uses about 1-1.5 GB of
  # memory once its signature database is loaded (about 20-60 s after start).
  # The image ships a signature snapshot from its build date; signature updates
  # (freshclam) are off locally so start-up needs no network. Production runs
  # its own clamd with freshclam on.
  clamav:
    image: clamav/clamav:1.5.4
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 180s

volumes:
  postgres-data:
  minio-data:
